name: Deploy Alpha Compose production

on:
  workflow_run:
    workflows: [Alpha Compose CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      import_existing_firestore:
        description: Import an existing untracked default Firestore database into Terraform state
        required: false
        default: false
        type: boolean
      import_existing_private_preview:
        description: Import reviewed existing production private-preview resources into Terraform state
        required: false
        default: false
        type: boolean
      allow_destructive_terraform:
        description: Apply a reviewed Terraform plan containing delete or replacement actions
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
  PROJECT_ID: animated-graph-cloud-prod-jp
  PROJECT_NUMBER: "488013150738"
  REGION: europe-central2
  REPOSITORY: containers
  SERVICE: agg-api
  OVERLAY_SERVICE: agg-overlay
  DURABLE_JOB: agg-renderer
  SMOKE_JOB: agg-renderer-smoke
  PRIVATE_PREVIEW_JOB: agg-production-private-preview
  DEPLOYER_SERVICE_ACCOUNT: agg-github-deployer@animated-graph-cloud-prod-jp.iam.gserviceaccount.com
  API_SERVICE_ACCOUNT: agg-api@animated-graph-cloud-prod-jp.iam.gserviceaccount.com
  RENDERER_SERVICE_ACCOUNT: agg-renderer@animated-graph-cloud-prod-jp.iam.gserviceaccount.com
  PRIVATE_PREVIEW_TASKS_SERVICE_ACCOUNT: agg-prod-preview-tasks@animated-graph-cloud-prod-jp.iam.gserviceaccount.com
  PRIVATE_PREVIEW_WORKER_SERVICE_ACCOUNT: agg-prod-preview-worker@animated-graph-cloud-prod-jp.iam.gserviceaccount.com
  PRIVATE_PREVIEW_BUCKET: animated-graph-cloud-prod-jp-production-private-previews
  PRIVATE_PREVIEW_QUEUE: agg-production-private-preview
  OWNER_EMAIL: me@jamiep.org
  ADMIN_EMAILS: me@jamiep.org;bartoszjakubowiak@gmail.com
  PRODUCT_UPDATES_SENDER: Alpha Compose <early-access@alphacompose.com>
  PRODUCT_UPDATES_RECIPIENT: me@jamiep.org
  PUBLIC_BASE_URL: https://alphacompose.com
  DAILY_SUBMISSION_LIMIT: "100"
  MONTHLY_BUDGET_MINOR_UNITS: "40000"
  PREVIEW_RESERVATION_MINOR_UNITS: "125"
  RENDER_RESERVATION_MINOR_UNITS: "125"

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - name: Verify successful CI for manual recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_COMMIT&status=success" \
            --jq '.total_count')"
          if [ "$successful_runs" -lt 1 ]; then
            echo "::error title=Successful CI required::The exact manual recovery commit has no successful Alpha Compose CI run."
            exit 1
          fi

      - name: Verify CI-approved commit
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release commit must be an exact full 40-character lowercase commit SHA." >&2
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - id: auth
        name: Authenticate through production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/animated-graph-cloud
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 541.0.0"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - id: terraform-context
        name: Discover current Terraform release inputs
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          renderer_image="$(gcloud run jobs describe "$DURABLE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          if [ -z "$service_url" ] || [ -z "$renderer_image" ]; then
            echo "::error title=Terraform bootstrap required::Production Cloud Run resources are missing. Follow docs/production-runbook.md before running automatic deployment."
            exit 1
          fi
          echo "service_url=$service_url" >>"$GITHUB_OUTPUT"
          echo "renderer_image=$renderer_image" >>"$GITHUB_OUTPUT"

      - name: Plan and apply production Terraform
        env:
          ALLOW_DESTRUCTIVE_TERRAFORM: ${{ inputs.allow_destructive_terraform }}
          API_SERVICE_URL: ${{ steps.terraform-context.outputs.service_url }}
          IMPORT_EXISTING_FIRESTORE: ${{ inputs.import_existing_firestore }}
          IMPORT_EXISTING_PRIVATE_PREVIEW: ${{ inputs.import_existing_private_preview }}
          RENDERER_IMAGE: ${{ steps.terraform-context.outputs.renderer_image }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/prod init -input=false

          state_resources="$(terraform -chdir=infra/prod state list)"
          for proto_address in \
            module.application.google_cloud_run_v2_service.proto \
            'module.application.google_cloud_run_v2_service.proto[0]'; do
            if grep -Fxq "$proto_address" <<<"$state_resources"; then
              echo "Detaching stale proto resource from main production Terraform state: $proto_address"
              terraform -chdir=infra/prod state rm "$proto_address"
            fi
          done
          state_resources="$(terraform -chdir=infra/prod state list)"
          firestore_address='module.application.google_firestore_database.default'
          if ! grep -Fxq "$firestore_address" <<<"$state_resources"; then
            firestore_error="$RUNNER_TEMP/firestore-describe-error"
            if gcloud firestore databases describe \
              --database='(default)' \
              --project="$PROJECT_ID" \
              >/dev/null 2>"$firestore_error"; then
              {
                echo "## Terraform import required"
                echo
                echo "The default production Firestore database exists but is not tracked in Terraform state."
                echo "Do not delete it. Manually dispatch this workflow with \`import_existing_firestore\` enabled."
              } >>"$GITHUB_STEP_SUMMARY"
              if [ "$IMPORT_EXISTING_FIRESTORE" != "true" ]; then
                echo "::error title=Terraform import required::The existing default Firestore database is absent from Terraform state. Re-run this workflow manually with import_existing_firestore enabled."
                exit 1
              fi
              terraform -chdir=infra/prod import \
                -input=false \
                -var="renderer_image=$RENDERER_IMAGE" \
                -var="api_service_url=$API_SERVICE_URL" \
                "$firestore_address" \
                "projects/$PROJECT_ID/databases/(default)"
            elif ! grep -Eq 'NOT_FOUND|does not exist' "$firestore_error"; then
              cat "$firestore_error" >&2
              exit 1
            fi
          fi

          import_private_preview_if_present() {
            local address="$1"
            local import_id="$2"
            shift 2
            if grep -Fxq "$address" <<<"$state_resources"; then
              return
            fi
            if "$@" >/dev/null 2>&1; then
              {
                echo "## Existing private-preview resources require reviewed import"
                echo
                echo "\`$address\` already exists outside production Terraform state."
                echo "Do not delete it. Review it, then manually dispatch with \`import_existing_private_preview\` enabled."
              } >>"$GITHUB_STEP_SUMMARY"
              if [ "$IMPORT_EXISTING_PRIVATE_PREVIEW" != "true" ]; then
                echo "::error title=Private-preview Terraform import required::$address exists outside production Terraform state. Do not delete it. Review it, then manually dispatch with import_existing_private_preview enabled."
                exit 1
              fi
              terraform -chdir=infra/prod import \
                -input=false \
                -var="renderer_image=$RENDERER_IMAGE" \
                -var="api_service_url=$API_SERVICE_URL" \
                "$address" \
                "$import_id"
              state_resources="$(terraform -chdir=infra/prod state list)"
            fi
          }

          import_private_preview_if_present \
            google_service_account.production_private_preview_tasks \
            "projects/$PROJECT_ID/serviceAccounts/$PRIVATE_PREVIEW_TASKS_SERVICE_ACCOUNT" \
            gcloud iam service-accounts describe "$PRIVATE_PREVIEW_TASKS_SERVICE_ACCOUNT" \
              --project="$PROJECT_ID"
          import_private_preview_if_present \
            google_service_account.production_private_preview_worker \
            "projects/$PROJECT_ID/serviceAccounts/$PRIVATE_PREVIEW_WORKER_SERVICE_ACCOUNT" \
            gcloud iam service-accounts describe "$PRIVATE_PREVIEW_WORKER_SERVICE_ACCOUNT" \
              --project="$PROJECT_ID"
          import_private_preview_if_present \
            google_storage_bucket.production_private_previews \
            "$PRIVATE_PREVIEW_BUCKET" \
            gcloud storage buckets describe "gs://$PRIVATE_PREVIEW_BUCKET" \
              --project="$PROJECT_ID"
          import_private_preview_if_present \
            google_cloud_tasks_queue.production_private_preview \
            "projects/$PROJECT_ID/locations/$REGION/queues/$PRIVATE_PREVIEW_QUEUE" \
            gcloud tasks queues describe "$PRIVATE_PREVIEW_QUEUE" \
              --project="$PROJECT_ID" \
              --location="$REGION"
          import_private_preview_if_present \
            google_cloud_run_v2_job.production_private_preview \
            "projects/$PROJECT_ID/locations/$REGION/jobs/$PRIVATE_PREVIEW_JOB" \
            gcloud run jobs describe "$PRIVATE_PREVIEW_JOB" \
              --project="$PROJECT_ID" \
              --region="$REGION"
          import_private_preview_if_present \
            google_cloud_scheduler_job.production_private_preview_reconcile \
            "projects/$PROJECT_ID/locations/$REGION/jobs/agg-production-private-preview-reconcile" \
            gcloud scheduler jobs describe agg-production-private-preview-reconcile \
              --project="$PROJECT_ID" \
              --location="$REGION"

          plan_path="$RUNNER_TEMP/prod.tfplan"
          plan_json="$RUNNER_TEMP/prod.tfplan.json"
          terraform -chdir=infra/prod plan \
            -input=false \
            -lock-timeout=5m \
            -out="$plan_path" \
            -var="renderer_image=$RENDERER_IMAGE" \
            -var="api_service_url=$API_SERVICE_URL" \
            -var="private_preview_reconciliation_paused=true"
          terraform -chdir=infra/prod show -json "$plan_path" >"$plan_json"

          creates="$(jq '[.resource_changes[]? | select(.change.actions == ["create"])] | length' "$plan_json")"
          updates="$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' "$plan_json")"
          deletes="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$plan_json")"
          {
            echo "## Production Terraform plan"
            echo
            echo "- Create: $creates"
            echo "- Update: $updates"
            echo "- Delete or replace: $deletes"
            echo
            echo "| Resource | Actions |"
            echo "| --- | --- |"
            jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | "| `\(.address)` | `\(.change.actions | join(" -> "))` |"' "$plan_json"
          } >>"$GITHUB_STEP_SUMMARY"

          if [ "$deletes" -gt 0 ] && [ "$ALLOW_DESTRUCTIVE_TERRAFORM" != "true" ]; then
            echo "::error title=Destructive Terraform plan blocked::Review the plan summary, then manually dispatch this workflow with allow_destructive_terraform enabled if the deletion or replacement is intended."
            exit 1
          fi

          terraform -chdir=infra/prod apply -input=false "$plan_path"

      - name: Verify production Picker API key
        run: |
          set -euo pipefail
          key_resource="$({
            gcloud secrets versions access latest \
              --project="$PROJECT_ID" \
              --secret=picker-api-key
          } | curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $(gcloud auth print-access-token)" \
            --data-urlencode 'keyString@-' \
            'https://apikeys.googleapis.com/v2/keys:lookupKey' |
            jq --raw-output '.name // empty')"
          expected_key_prefix="projects/$PROJECT_NUMBER/locations/global/keys/"
          case "$key_resource" in
            "$expected_key_prefix"*) ;;
            *)
              echo "picker-api-key is not owned by the production project" >&2
              exit 1
              ;;
          esac
          api_targets="$(gcloud services api-keys describe "$key_resource" \
            --project="$PROJECT_ID" \
            --format='json(restrictions)')"
          jq -e '
            (.restrictions | keys | sort) == ["apiTargets"] and
            (.restrictions.apiTargets | length == 1) and
            (.restrictions.apiTargets[0].service == "picker.googleapis.com")
          ' <<<"$api_targets" >/dev/null

      - name: Verify enabled Resend secret version
        run: |
          set -euo pipefail
          if ! resend_secret_state="$(gcloud secrets versions describe latest \
            --project="$PROJECT_ID" \
            --secret=resend-api-key \
            --format='value(state)')"; then
            echo "::error title=Resend bootstrap required::The production Terraform apply created the secret container and IAM. Add an enabled production resend-api-key version, then rerun this workflow through workflow_dispatch."
            exit 1
          fi
          if ! test "$resend_secret_state" = "ENABLED"; then
            echo "::error title=Resend bootstrap required::Enable a production resend-api-key version, then rerun this workflow through workflow_dispatch."
            exit 1
          fi

      - name: Verify YouTube metadata API key
        run: |
          set -euo pipefail
          if ! key_resource="$({
            gcloud secrets versions access latest \
              --project="$PROJECT_ID" \
              --secret=youtube-api-key
          } | curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $(gcloud auth print-access-token)" \
            --data-urlencode 'keyString@-' \
            'https://apikeys.googleapis.com/v2/keys:lookupKey' | \
            jq --raw-output '.name // empty')"; then
            echo "::error title=YouTube metadata bootstrap required::Production Terraform created the container and IAM. Add an enabled project-owned youtube-api-key version restricted only to youtube.googleapis.com, then rerun this workflow through workflow_dispatch."
            exit 1
          fi
          case "$key_resource" in
            "projects/$PROJECT_NUMBER/locations/global/keys/"*) ;;
            *)
              echo "::error title=YouTube metadata bootstrap required::youtube-api-key must belong to the production project."
              exit 1
              ;;
          esac
          restrictions="$(gcloud services api-keys describe "$key_resource" \
            --project="$PROJECT_ID" --format='json(restrictions)')"
          jq -e '
            (.restrictions | keys | sort) == ["apiTargets"] and
            (.restrictions.apiTargets | length == 1) and
            (.restrictions.apiTargets[0].service == "youtube.googleapis.com")
          ' <<<"$restrictions" >/dev/null || {
            echo "::error title=YouTube metadata bootstrap required::Restrict the project-owned key only to youtube.googleapis.com."
            exit 1
          }

      - id: image
        name: Resolve CI-built immutable candidate digest
        env:
          IMAGE_TAG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/animated-graph-cloud:${{ env.RELEASE_COMMIT }}
        run: |
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          test -n "$digest"
          echo "uri=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/animated-graph-cloud@$digest" >>"$GITHUB_OUTPUT"

      - name: Deploy private API candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.uri }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_DIGEST" \
            --service-account "$API_SERVICE_ACCOUNT" \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --timeout 300 \
            --cpu-boost \
            --min 0 \
            --max 2 \
            --no-allow-unauthenticated \
            --quiet

      - name: Deploy private overlay candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.uri }}
        run: |
          gcloud run deploy "$OVERLAY_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_DIGEST" \
            --service-account "$API_SERVICE_ACCOUNT" \
            --port 8080 \
            --cpu 8 \
            --memory 32Gi \
            --concurrency 1 \
            --timeout 3600 \
            --execution-environment gen2 \
            --cpu-boost \
            --min 0 \
            --max 2 \
            --no-allow-unauthenticated \
            --quiet

      - name: Execute isolated renderer smoke
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.uri }}
        run: |
          gcloud run jobs deploy "$SMOKE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_DIGEST" \
            --service-account "$RENDERER_SERVICE_ACCOUNT" \
            --args clojure.main,-m,agg.renderer.main \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 5m \
            --cpu 1 \
            --memory 512Mi \
            --quiet
          gcloud run jobs execute "$SMOKE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait

      - id: service-url
        name: Discover private API origin
        run: |
          service_url="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$service_url"
          echo "url=$service_url" >>"$GITHUB_OUTPUT"

      - id: overlay-service-url
        name: Discover private overlay origin
        run: |
          service_url="$(gcloud run services describe "$OVERLAY_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$service_url"
          echo "url=$service_url" >>"$GITHUB_OUTPUT"

      - name: Configure API and overlay production runtimes
        env:
          CLOUD_RUN_SERVICE_URL: ${{ steps.service-url.outputs.url }}
        run: |
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --remove-env-vars "AGG_MONTHLY_BUDGET_CENTS,AGG_PREVIEW_RESERVATION_CENTS,AGG_RENDER_RESERVATION_CENTS" \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT_ID,AGG_SERVICE_PROFILE=api,AGG_JOB_LIFECYCLE_ENABLED=true,AGG_AUTH_ENABLED=true,AGG_REGION=$REGION,AGG_TEMPORARY_BUCKET=$PROJECT_ID-temporary,AGG_TASKS_QUEUE=agg-render,AGG_TASKS_SERVICE_ACCOUNT=agg-tasks@$PROJECT_ID.iam.gserviceaccount.com,AGG_SCHEDULER_SERVICE_ACCOUNT=agg-scheduler@$PROJECT_ID.iam.gserviceaccount.com,AGG_RENDERER_JOB=$DURABLE_JOB,AGG_DISPATCHER_URL=$CLOUD_RUN_SERVICE_URL,AGG_PUBLIC_BASE_URL=$PUBLIC_BASE_URL,AGG_OWNER_EMAIL=$OWNER_EMAIL,AGG_ADMIN_EMAILS=$ADMIN_EMAILS,AGG_PICKER_APP_ID=$PROJECT_NUMBER,AGG_PRODUCT_UPDATES_SENDER=$PRODUCT_UPDATES_SENDER,AGG_PRODUCT_UPDATES_RECIPIENT=$PRODUCT_UPDATES_RECIPIENT,AGG_DAILY_SUBMISSION_LIMIT=$DAILY_SUBMISSION_LIMIT,AGG_MONTHLY_BUDGET_MINOR_UNITS=$MONTHLY_BUDGET_MINOR_UNITS,AGG_PREVIEW_RESERVATION_MINOR_UNITS=$PREVIEW_RESERVATION_MINOR_UNITS,AGG_RENDER_RESERVATION_MINOR_UNITS=$RENDER_RESERVATION_MINOR_UNITS,AGG_DERIVATIVE_ENVIRONMENT=production,AGG_DERIVATIVE_CONTRACT_VERSION=production-private-preview-contract-v1,AGG_DERIVATIVE_PROFILE_VERSION=h264-aac-1080p25-v1,AGG_DERIVATIVE_BUCKET=$PRIVATE_PREVIEW_BUCKET,AGG_DERIVATIVE_DISPATCHER_URL=$CLOUD_RUN_SERVICE_URL,AGG_DERIVATIVE_TASKS_QUEUE=$PRIVATE_PREVIEW_QUEUE,AGG_DERIVATIVE_TASKS_SERVICE_ACCOUNT=$PRIVATE_PREVIEW_TASKS_SERVICE_ACCOUNT,AGG_DERIVATIVE_WORKER_JOB=$PRIVATE_PREVIEW_JOB,AGG_DERIVATIVE_WORKER_SERVICE_ACCOUNT=$PRIVATE_PREVIEW_WORKER_SERVICE_ACCOUNT,AGG_DERIVATIVE_JOB_COLLECTION=production-derivative-preparation-jobs-v1,AGG_DERIVATIVE_CACHE_COLLECTION=production-derivative-preview-cache-v1,AGG_DERIVATIVE_IDEMPOTENCY_COLLECTION=production-derivative-preparation-idempotency-v1,AGG_DERIVATIVE_ORCHESTRATION_COLLECTION=production-derivative-active-jobs-v1,AGG_DERIVATIVE_OBJECT_PREFIX=production/derivative-previews/v1,AGG_DERIVATIVE_ASSET_TTL_SECONDS=86400,AGG_DERIVATIVE_JOB_METADATA_TTL_SECONDS=86400,AGG_DERIVATIVE_PLAYBACK_AUTHORITY_TTL_SECONDS=3600,AGG_DERIVATIVE_CACHE_MINIMUM_REMAINING_TTL_SECONDS=3600,AGG_DERIVATIVE_MAX_SOURCE_DURATION_SECONDS=480,AGG_DERIVATIVE_MAX_SOURCE_BYTES=2147483648,AGG_DERIVATIVE_MAX_UPSTREAM_BYTES=2415919104,AGG_DERIVATIVE_MAX_REQUEST_COUNT=320,AGG_DERIVATIVE_MAX_RANGE_BYTES=8388608,AGG_DERIVATIVE_MAX_OUTPUT_BYTES=268435456,AGG_DERIVATIVE_ATTEMPT_RESERVATION_MINOR_UNITS=125,AGG_DERIVATIVE_MAX_PROJECT_NONTERMINAL_JOBS=10,AGG_DERIVATIVE_MAX_USER_NONTERMINAL_JOBS=1,AGG_DERIVATIVE_MAX_USER_ATTEMPTS_PER_DAY=5,AGG_DERIVATIVE_MAX_USER_MONTHLY_MINOR_UNITS=2500,AGG_DERIVATIVE_MAX_MONTHLY_MINOR_UNITS=10000" \
            --update-secrets "AGG_OAUTH_CLIENT_CREDENTIALS=oauth-client-secret:latest,AGG_SESSION_KEY=session-key:latest,AGG_PICKER_API_KEY=picker-api-key:latest,AGG_TOKEN_HASH_PEPPER=token-hash-pepper:latest,AGG_RESEND_API_KEY=resend-api-key:latest,AGG_YOUTUBE_API_KEY=youtube-api-key:latest" \
            --quiet
          gcloud run services update "$OVERLAY_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --remove-env-vars "AGG_MONTHLY_BUDGET_CENTS,AGG_PREVIEW_RESERVATION_CENTS,AGG_RENDER_RESERVATION_CENTS" \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT_ID,AGG_SERVICE_PROFILE=overlay,AGG_JOB_LIFECYCLE_ENABLED=true,AGG_AUTH_ENABLED=true,AGG_REGION=$REGION,AGG_TEMPORARY_BUCKET=$PROJECT_ID-temporary,AGG_TASKS_QUEUE=agg-render,AGG_TASKS_SERVICE_ACCOUNT=agg-tasks@$PROJECT_ID.iam.gserviceaccount.com,AGG_SCHEDULER_SERVICE_ACCOUNT=agg-scheduler@$PROJECT_ID.iam.gserviceaccount.com,AGG_RENDERER_JOB=$DURABLE_JOB,AGG_DISPATCHER_URL=$CLOUD_RUN_SERVICE_URL,AGG_PUBLIC_BASE_URL=$PUBLIC_BASE_URL,AGG_OWNER_EMAIL=$OWNER_EMAIL,AGG_ADMIN_EMAILS=$ADMIN_EMAILS,AGG_PICKER_APP_ID=$PROJECT_NUMBER,AGG_DAILY_SUBMISSION_LIMIT=$DAILY_SUBMISSION_LIMIT,AGG_MONTHLY_BUDGET_MINOR_UNITS=$MONTHLY_BUDGET_MINOR_UNITS,AGG_PREVIEW_RESERVATION_MINOR_UNITS=$PREVIEW_RESERVATION_MINOR_UNITS,AGG_RENDER_RESERVATION_MINOR_UNITS=$RENDER_RESERVATION_MINOR_UNITS" \
            --update-secrets "AGG_OAUTH_CLIENT_CREDENTIALS=oauth-client-secret:latest,AGG_SESSION_KEY=session-key:latest,AGG_PICKER_API_KEY=picker-api-key:latest,AGG_TOKEN_HASH_PEPPER=token-hash-pepper:latest" \
            --quiet

      - id: api-health-auth
        name: Mint API origin identity token through WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/animated-graph-cloud
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service-url.outputs.url }}
          id_token_include_email: true

      - id: overlay-health-auth
        name: Mint overlay origin identity token through WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/animated-graph-cloud
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.overlay-service-url.outputs.url }}
          id_token_include_email: true

      - name: Verify private API and overlay candidates
        env:
          CLOUD_RUN_SERVICE_URL: ${{ steps.service-url.outputs.url }}
          CLOUD_RUN_ID_TOKEN: ${{ steps.api-health-auth.outputs.id_token }}
          OVERLAY_RUN_SERVICE_URL: ${{ steps.overlay-service-url.outputs.url }}
          OVERLAY_RUN_ID_TOKEN: ${{ steps.overlay-health-auth.outputs.id_token }}
        run: |
          api_health="$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors \
            --header "Authorization: Bearer $CLOUD_RUN_ID_TOKEN" \
            "$CLOUD_RUN_SERVICE_URL/health")"
          test "$api_health" = '{"status":"ok"}'
          overlay_health="$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors \
            --header "Authorization: Bearer $OVERLAY_RUN_ID_TOKEN" \
            "$OVERLAY_RUN_SERVICE_URL/health")"
          test "$overlay_health" = '{"status":"ok"}'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $CLOUD_RUN_ID_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$CLOUD_RUN_SERVICE_URL/v1/overlay")" = 404
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $OVERLAY_RUN_ID_TOKEN" \
            "$OVERLAY_RUN_SERVICE_URL/privacy")" = 404
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "X-Serverless-Authorization: Bearer $OVERLAY_RUN_ID_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$OVERLAY_RUN_SERVICE_URL/v1/overlay")" = 401

      - name: Restore deployment credentials after candidate verification
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/animated-graph-cloud
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Reconcile production runtimes through Terraform
        env:
          ALLOW_DESTRUCTIVE_TERRAFORM: ${{ inputs.allow_destructive_terraform }}
          IMAGE_DIGEST: ${{ steps.image.outputs.uri }}
          CLOUD_RUN_SERVICE_URL: ${{ steps.service-url.outputs.url }}
        run: |
          runtime_plan="$RUNNER_TEMP/prod-runtime.tfplan"
          runtime_plan_json="$RUNNER_TEMP/prod-runtime.tfplan.json"
          terraform -chdir=infra/prod plan -input=false \
            -var="renderer_image=$IMAGE_DIGEST" \
            -var="api_service_url=$CLOUD_RUN_SERVICE_URL" \
            -var="private_preview_reconciliation_paused=false" \
            -target=module.application.google_cloud_run_v2_service.api \
            -target=module.application.google_cloud_run_v2_service.overlay \
            -target=module.application.google_cloud_run_v2_job.renderer \
            -target=google_cloud_run_v2_job.production_private_preview \
            -target=google_cloud_scheduler_job.production_private_preview_reconcile \
            -out="$runtime_plan"
          terraform -chdir=infra/prod show -json "$runtime_plan" \
            >"$runtime_plan_json"
          runtime_deletes="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$runtime_plan_json")"
          if [ "$runtime_deletes" -gt 0 ] && [ "$ALLOW_DESTRUCTIVE_TERRAFORM" != "true" ]; then
            echo "::error title=Destructive runtime Terraform plan blocked::The runtime reconcile contains delete or replacement actions. Automatic production deployment cannot apply it."
            exit 1
          fi
          terraform -chdir=infra/prod apply -input=false "$runtime_plan"

      - name: Verify reconciled private services
        env:
          CLOUD_RUN_SERVICE_URL: ${{ steps.service-url.outputs.url }}
          CLOUD_RUN_ID_TOKEN: ${{ steps.api-health-auth.outputs.id_token }}
          OVERLAY_RUN_SERVICE_URL: ${{ steps.overlay-service-url.outputs.url }}
          OVERLAY_RUN_ID_TOKEN: ${{ steps.overlay-health-auth.outputs.id_token }}
        run: |
          test "$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors \
            --header "X-Serverless-Authorization: Bearer $CLOUD_RUN_ID_TOKEN" \
            "$CLOUD_RUN_SERVICE_URL/health")" = '{"status":"ok"}'
          test "$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors \
            --header "X-Serverless-Authorization: Bearer $OVERLAY_RUN_ID_TOKEN" \
            "$OVERLAY_RUN_SERVICE_URL/health")" = '{"status":"ok"}'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "X-Serverless-Authorization: Bearer $CLOUD_RUN_ID_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$CLOUD_RUN_SERVICE_URL/v1/overlay")" = 404
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "X-Serverless-Authorization: Bearer $OVERLAY_RUN_ID_TOKEN" \
            "$OVERLAY_RUN_SERVICE_URL/privacy")" = 404
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "X-Serverless-Authorization: Bearer $OVERLAY_RUN_ID_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$OVERLAY_RUN_SERVICE_URL/v1/overlay")" = 401

      - name: Restore public invokers
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet
          gcloud run services add-iam-policy-binding "$OVERLAY_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet

      - name: Publish pinned Firebase Hosting routes
        run: >-
          npx --yes firebase-tools@15.24.0 deploy
          --only hosting
          --project "$PROJECT_ID"
          --non-interactive

      - name: Verify public release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          test "$(curl --fail --silent --show-error --retry 5 --retry-all-errors "$PUBLIC_BASE_URL/health")" = '{"status":"ok"}'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$PUBLIC_BASE_URL/v1/overlay")" = 401
          curl --fail --silent --show-error "$PUBLIC_BASE_URL/privacy" | grep -q 'Privacy policy'
          curl --fail --silent --show-error "$PUBLIC_BASE_URL/terms" | grep -q 'Terms of service'
          range_worker_headers="$RUNNER_TEMP/derivative-playback-range-worker.headers"
          range_worker="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --dump-header "$range_worker_headers" \
            "$PUBLIC_BASE_URL/derivative-playback-range-worker.js")"
          grep -Fiq 'content-type: application/javascript; charset=utf-8' "$range_worker_headers"
          grep -Fiq 'cache-control: no-store' "$range_worker_headers"
          grep -Fiq 'service-worker-allowed: /' "$range_worker_headers"
          grep -Fq 'self.clients.claim()' <<<"$range_worker"
          grep -Fq '__agg_range' <<<"$range_worker"
          SHORT_RELEASE_COMMIT="${RELEASE_COMMIT:0:7}"
          changelog="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$PUBLIC_BASE_URL/changelog")"
          grep -Fq "v0.8.0 · build $SHORT_RELEASE_COMMIT" <<<"$changelog"
          if grep -Fq 'Unreleased' <<<"$changelog"; then
            echo "Public changelog exposed repository-only Unreleased notes." >&2
            exit 1
          fi
          contract_headers="$RUNNER_TEMP/openapi.headers"
          contract="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --dump-header "$contract_headers" "$PUBLIC_BASE_URL/openapi.yaml")"
          grep -q '^openapi: 3.1.0$' <<<"$contract"
          grep -iq '^content-type: application/yaml; charset=utf-8' "$contract_headers"

      - name: Record release summary
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.uri }}
        run: |
          {
            echo "## Alpha Compose production deployment"
            echo
            echo "- Ref: ${{ github.ref }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Image: $IMAGE_DIGEST"
            echo "- Domain: $PUBLIC_BASE_URL"
            echo "- Administrators: $ADMIN_EMAILS"
            echo "- Terraform: planned and applied before candidate promotion"
            echo "- Manual acceptance remains recorded separately"
          } >>"$GITHUB_STEP_SUMMARY"
