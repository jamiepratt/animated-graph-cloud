name: Proto CI

on:
  push:
    branches: [codex/issue-161-proto-only]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1654
          clj-kondo: 2026.05.25
      - run: clj-kondo --lint src/agg/proto src/agg/api/main.clj test/agg/proto_test_runner.clj test/agg/proto_release_test.clj test/agg/proto_source_test.clj test/agg/proto_ui_test.clj
      - run: clojure -M:proto-test
