name: Deploy proto smoke path

on:
  push:
    branches: [codex/issue-161-proto-only]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: development-proto-deployment
  cancel-in-progress: false

env:
  PROJECT_ID: animated-graph-cloud-jp
  PROJECT_NUMBER: "891643499444"
  REGION: europe-central2
  REPOSITORY: containers
  PROTO_SERVICE: agg-proto
  IMAGE: europe-central2-docker.pkg.dev/animated-graph-cloud-jp/containers/animated-graph-cloud:${{ github.sha }}
  DEPLOYER_SERVICE_ACCOUNT: agg-github-deployer@animated-graph-cloud-jp.iam.gserviceaccount.com
  API_SERVICE_ACCOUNT: agg-api@animated-graph-cloud-jp.iam.gserviceaccount.com
  OWNER_EMAIL: me@jamiep.org
  ADMIN_EMAILS: me@jamiep.org;bartoszjakubowiak@gmail.com
  DAILY_SUBMISSION_LIMIT: "100"
  MONTHLY_BUDGET_MINOR_UNITS: "40000"
  PREVIEW_RESERVATION_MINOR_UNITS: "125"
  RENDER_RESERVATION_MINOR_UNITS: "125"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag "$IMAGE" .

      - name: Verify proto container health locally
        run: |
          set -euo pipefail
          health_file="$(mktemp)"
          container_id="$(docker run --rm -d -p 127.0.0.1::8080 -e AGG_SERVICE_PROFILE=proto "$IMAGE")"
          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
            rm -f "$health_file"
          }
          trap cleanup EXIT INT TERM
          host_port="$(docker port "$container_id" 8080/tcp | sed -n 's/.*://p' | tail -1)"
          attempt=0
          while [ "$attempt" -lt 50 ]; do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:$host_port/health" >"$health_file" 2>/dev/null; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 0.2
          done
          test "$(cat "$health_file")" = '{"status":"ok"}'

      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - id: auth
        name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/animated-graph-cloud
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 541.0.0"

      - id: image
        name: Push and resolve immutable image digest
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"
          digest="$(gcloud artifacts docker images describe "$IMAGE" \
            --format='value(image_summary.digest)')"
          test -n "$digest"
          echo "uri=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/animated-graph-cloud@$digest" >>"$GITHUB_OUTPUT"

      - id: api-service-url
        name: Discover existing development API URL
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe agg-api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format 'value(status.url)')"
          test -n "$service_url"
          echo "url=$service_url" >>"$GITHUB_OUTPUT"

      - name: Deploy proto service
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.uri }}
          API_SERVICE_URL: ${{ steps.api-service-url.outputs.url }}
        run: |
          gcloud run deploy "$PROTO_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_DIGEST" \
            --service-account "$API_SERVICE_ACCOUNT" \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 16 \
            --min 0 \
            --max 2 \
            --no-allow-unauthenticated \
            --update-env-vars "AGG_JOB_LIFECYCLE_ENABLED=true,AGG_AUTH_ENABLED=true,AGG_SERVICE_PROFILE=proto,AGG_REGION=$REGION,AGG_TEMPORARY_BUCKET=$PROJECT_ID-temporary,AGG_TASKS_QUEUE=agg-render,AGG_TASKS_SERVICE_ACCOUNT=agg-tasks@$PROJECT_ID.iam.gserviceaccount.com,AGG_SCHEDULER_SERVICE_ACCOUNT=agg-scheduler@$PROJECT_ID.iam.gserviceaccount.com,AGG_RENDERER_JOB=agg-renderer,AGG_DISPATCHER_URL=$API_SERVICE_URL,AGG_OWNER_EMAIL=$OWNER_EMAIL,AGG_ADMIN_EMAILS=$ADMIN_EMAILS,AGG_DAILY_SUBMISSION_LIMIT=$DAILY_SUBMISSION_LIMIT,AGG_MONTHLY_BUDGET_MINOR_UNITS=$MONTHLY_BUDGET_MINOR_UNITS,AGG_PREVIEW_RESERVATION_MINOR_UNITS=$PREVIEW_RESERVATION_MINOR_UNITS,AGG_RENDER_RESERVATION_MINOR_UNITS=$RENDER_RESERVATION_MINOR_UNITS" \
            --update-secrets "AGG_OAUTH_CLIENT_CREDENTIALS=oauth-client-secret:latest,AGG_SESSION_KEY=session-key:latest,AGG_TOKEN_HASH_PEPPER=token-hash-pepper:latest" \
            --quiet

      - id: proto-service-url
        name: Discover private proto audience
        run: |
          service_url="$(gcloud run services describe "$PROTO_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format 'value(status.url)')"
          echo "url=$service_url" >>"$GITHUB_OUTPUT"

      - name: Set proto public base URL
        env:
          PROTO_RUN_SERVICE_URL: ${{ steps.proto-service-url.outputs.url }}
        run: |
          gcloud run services update "$PROTO_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-env-vars "AGG_PUBLIC_BASE_URL=$PROTO_RUN_SERVICE_URL" \
            --quiet

      - name: Open proto ingress
        run: |
          gcloud run services add-iam-policy-binding "$PROTO_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet

      - name: Verify proto health and identity
        env:
          PROTO_RUN_SERVICE_URL: ${{ steps.proto-service-url.outputs.url }}
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors \
            "$PROTO_RUN_SERVICE_URL/health")"
          test "$health" = '{"status":"ok"}'
          service_identity="$(gcloud run services describe "$PROTO_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format 'value(spec.template.spec.serviceAccountName)')"
          test "$service_identity" = "$API_SERVICE_ACCOUNT"
