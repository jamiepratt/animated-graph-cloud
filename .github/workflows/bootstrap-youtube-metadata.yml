name: Repair development YouTube key lookup IAM

on:
  workflow_dispatch:
    inputs:
      confirm_development_viewer_iam_repair:
        description: Confirm only the missing development API Keys viewer IAM binding may be created and every other target must remain unchanged
        required: true
        default: false
        type: boolean

permissions: {}

env:
  PROJECT_ID: animated-graph-cloud-jp
  PROJECT_NUMBER: "891643499444"
  TF_DIRECTORY: infra/dev

jobs:
  bootstrap:
    if: inputs.confirm_development_viewer_iam_repair == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/animated-graph-cloud
          service_account: agg-github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 541.0.0"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Plan and apply exact development viewer IAM repair
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIRECTORY" init -input=false
          renderer_image="$(gcloud run jobs describe agg-renderer --project="$PROJECT_ID" --region=europe-central2 --format='value(spec.template.spec.template.spec.containers[0].image)')"
          api_service_url="$(gcloud run services describe agg-api --project="$PROJECT_ID" --region=europe-central2 --format='value(status.url)')"
          test -n "$renderer_image"
          plan="$RUNNER_TEMP/youtube-metadata-bootstrap.tfplan"
          plan_json="$RUNNER_TEMP/youtube-metadata-bootstrap.tfplan.json"
          terraform -chdir="$TF_DIRECTORY" plan -input=false -lock-timeout=5m \
            -var="renderer_image=$renderer_image" \
            -var="api_service_url=$api_service_url" \
            -target="google_project_service.required[\"apikeys.googleapis.com\"]" \
            -target="google_project_service.required[\"youtube.googleapis.com\"]" \
            -target="google_secret_manager_secret.application[\"youtube-api-key\"]" \
            -target="google_secret_manager_secret_iam_member.api_youtube_access" \
            -target="google_secret_manager_secret_iam_member.deployer_youtube_access" \
            -target="google_project_iam_member.deployer_picker_api_keys_viewer" \
            -out="$plan"
          terraform -chdir="$TF_DIRECTORY" show "$plan"
          terraform -chdir="$TF_DIRECTORY" show -json "$plan" >"$plan_json"

          {
            echo "## Exact development YouTube lookup IAM repair plan"
            echo
            echo "| Resource | Actions |"
            echo "| --- | --- |"
            jq -r '.resource_changes[]?
              | select(.mode == "managed" and .change.actions != ["no-op"])
              | "| `\(.address)` | `\(.change.actions | join(" -> "))` |"' \
              "$plan_json"
          } >>"$GITHUB_STEP_SUMMARY"
          if ! script/guard_youtube_metadata_bootstrap_plan.sh "$plan_json"; then
            echo "::error title=YouTube metadata bootstrap plan blocked::Only creation of the development API Keys viewer IAM binding is authorized. Every other selected target must be unchanged."
            exit 1
          fi
          terraform -chdir="$TF_DIRECTORY" apply -input=false "$plan"

      - name: Record the completed development IAM repair
        run: |
          {
            echo "## Development YouTube key lookup IAM repaired"
            echo
            echo "Terraform created only the development deployer's least-privilege API Keys viewer binding."
            echo "The five existing YouTube bootstrap targets were unchanged."
            echo "No application was promoted and no key or secret value was created, read, changed, or logged."
          } >>"$GITHUB_STEP_SUMMARY"
