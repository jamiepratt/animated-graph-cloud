name: Bootstrap YouTube metadata infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose secret container and IAM should be created
        required: true
        type: choice
        options: [development, production]
      confirm_bootstrap:
        description: Confirm this applies only reviewed Terraform API, secret-container, and least-privilege IAM resources and does not create or store a key value
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  bootstrap:
    if: inputs.confirm_bootstrap == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - id: context
        name: Select guarded environment
        run: |
          set -euo pipefail
          if [ "${{ inputs.environment }}" = production ]; then
            echo "project=animated-graph-cloud-prod-jp" >>"$GITHUB_OUTPUT"
            echo "number=488013150738" >>"$GITHUB_OUTPUT"
            echo "directory=infra/prod" >>"$GITHUB_OUTPUT"
            echo "prefix=module.application." >>"$GITHUB_OUTPUT"
          else
            echo "project=animated-graph-cloud-jp" >>"$GITHUB_OUTPUT"
            echo "number=891643499444" >>"$GITHUB_OUTPUT"
            echo "directory=infra/dev" >>"$GITHUB_OUTPUT"
            echo "prefix=" >>"$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.context.outputs.project }}
          workload_identity_provider: projects/${{ steps.context.outputs.number }}/locations/global/workloadIdentityPools/github/providers/animated-graph-cloud
          service_account: agg-github-deployer@${{ steps.context.outputs.project }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 541.0.0"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Plan and apply reviewed bootstrap only
        env:
          PROJECT_ID: ${{ steps.context.outputs.project }}
          TF_DIRECTORY: ${{ steps.context.outputs.directory }}
          TF_PREFIX: ${{ steps.context.outputs.prefix }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIRECTORY" init -input=false
          renderer_image="$(gcloud run jobs describe agg-renderer --project="$PROJECT_ID" --region=europe-central2 --format='value(spec.template.spec.template.spec.containers[0].image)')"
          api_service_url="$(gcloud run services describe agg-api --project="$PROJECT_ID" --region=europe-central2 --format='value(status.url)')"
          test -n "$renderer_image"
          plan="$RUNNER_TEMP/youtube-metadata-bootstrap.tfplan"
          plan_json="$RUNNER_TEMP/youtube-metadata-bootstrap.tfplan.json"
          terraform -chdir="$TF_DIRECTORY" plan -input=false -lock-timeout=5m \
            -var="renderer_image=$renderer_image" \
            -var="api_service_url=$api_service_url" \
            -target="${TF_PREFIX}google_project_service.required[\"apikeys.googleapis.com\"]" \
            -target="${TF_PREFIX}google_project_service.required[\"youtube.googleapis.com\"]" \
            -target="${TF_PREFIX}google_secret_manager_secret.application[\"youtube-api-key\"]" \
            -target="${TF_PREFIX}google_secret_manager_secret_iam_member.api_youtube_access" \
            -target="${TF_PREFIX}google_secret_manager_secret_iam_member.deployer_youtube_access" \
            -target="${TF_PREFIX}google_project_iam_member.deployer_picker_api_keys_viewer" \
            -out="$plan"
          terraform -chdir="$TF_DIRECTORY" show "$plan"
          terraform -chdir="$TF_DIRECTORY" show -json "$plan" >"$plan_json"

          destructive_changes="$(jq '[
            .resource_changes[]?
            | select(.mode == "managed")
            | select(.change.actions | index("delete"))
          ] | length' "$plan_json")"
          unexpected_changes="$(jq --arg prefix "$TF_PREFIX" '[
            .resource_changes[]?
            | select(.mode == "managed" and .change.actions != ["no-op"])
            | .address
            | select(
                . != ($prefix + "google_project_service.required[\"apikeys.googleapis.com\"]") and
                . != ($prefix + "google_project_service.required[\"youtube.googleapis.com\"]") and
                . != ($prefix + "google_secret_manager_secret.application[\"youtube-api-key\"]") and
                . != ($prefix + "google_secret_manager_secret_iam_member.api_youtube_access") and
                . != ($prefix + "google_secret_manager_secret_iam_member.deployer_youtube_access") and
                . != ($prefix + "google_project_iam_member.deployer_picker_api_keys_viewer"))
          ] | length' "$plan_json")"
          {
            echo "## Guarded YouTube metadata Terraform plan"
            echo
            echo "- Delete or replace: $destructive_changes"
            echo "- Unexpected resource changes: $unexpected_changes"
            echo
            echo "| Resource | Actions |"
            echo "| --- | --- |"
            jq -r '.resource_changes[]?
              | select(.mode == "managed" and .change.actions != ["no-op"])
              | "| `\(.address)` | `\(.change.actions | join(" -> "))` |"' \
              "$plan_json"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$destructive_changes" -ne 0 ] || [ "$unexpected_changes" -ne 0 ]; then
            echo "::error title=YouTube metadata bootstrap plan blocked::The plan contains a delete, replacement, or unrelated resource change. Do not apply it."
            exit 1
          fi
          terraform -chdir="$TF_DIRECTORY" apply -input=false "$plan"

      - name: Stop before the mandatory operator checkpoint
        run: |
          {
            echo "## YouTube metadata bootstrap complete"
            echo
            echo "Terraform applied API enablement, the empty youtube-api-key container, and scoped IAM only."
            echo "An operator must now create a project-owned key restricted only to youtube.googleapis.com and add it through standard input as documented in docs/production-runbook.md."
            echo "No application was promoted and no key value was created, read, or logged."
          } >>"$GITHUB_STEP_SUMMARY"
