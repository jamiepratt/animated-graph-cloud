name: Deploy proto app

on:
  push:
    branches: [proto]

permissions:
  contents: read

concurrency:
  group: proto-deployment
  cancel-in-progress: false

env:
  PROJECT_ID: animated-graph-cloud-prod-jp
  PROJECT_NUMBER: "488013150738"
  REGION: europe-central2
  REPOSITORY: containers
  SERVICE: agg-api
  PROTO_SERVICE: agg-proto
  IMAGE: europe-central2-docker.pkg.dev/animated-graph-cloud-prod-jp/containers/animated-graph-cloud:${{ github.sha }}
  DEPLOYER_SERVICE_ACCOUNT: agg-proto-github-deployer@animated-graph-cloud-prod-jp.iam.gserviceaccount.com
  PROTO_PUBLIC_BASE_URL: https://proto.alphacompose.com
  PROTO_FIREBASE_SITE: proto-alphacompose

jobs:
  affected-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1654
      - name: Run affected proto feedback
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          clojure -M:test-changed --base "$BASE_SHA" --head "$GITHUB_SHA"

  proto-tests:
    needs: affected-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1654
          clj-kondo: 2026.05.25
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Install FFmpeg for derivative media tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run complete proto-area gate
        run: test/proto_ci.sh

  candidate-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: auth
        name: Authenticate through proto-only WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/animated-graph-cloud-proto
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 541.0.0"
      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable proto candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            RELEASE_MODE=production
          cache-from: type=gha,scope=proto-image
          cache-to: type=gha,mode=max,scope=proto-image
      - name: Smoke proto candidate
        run: |
          docker pull "$IMAGE"
          test/proto_container_smoke.sh "$IMAGE" "$GITHUB_SHA"
      - name: Scan proto candidate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  deploy:
    needs: [proto-tests, candidate-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: auth
        name: Authenticate through proto-only WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/animated-graph-cloud-proto
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 541.0.0"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Verify private proto fixture source secret
        run: |
          secret_name="$(gcloud secrets describe proto-source-file-ids \
            --project="$PROJECT_ID" \
            --format='value(name)')"
          if [ -z "$secret_name" ]; then
            echo "::error title=Private proto fixture bootstrap required::Create the proto-source-file-ids secret and an enabled version before deployment."
            exit 1
          fi

      - id: service-url
        name: Discover current API dispatcher audience
        run: |
          service_url="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$service_url"
          echo "url=$service_url" >>"$GITHUB_OUTPUT"

      - id: proto-service-audience
        name: Discover existing proto derivative audience
        run: |
          service_url="$(gcloud run services describe "$PROTO_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$service_url"
          echo "url=$service_url" >>"$GITHUB_OUTPUT"

      - id: image
        name: Resolve CI-built immutable proto candidate digest
        run: |
          digest="$(gcloud artifacts docker images describe "$IMAGE" \
            --format='value(image_summary.digest)')"
          test -n "$digest"
          echo "uri=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/animated-graph-cloud@$digest" >>"$GITHUB_OUTPUT"

      - name: Plan and apply proto Terraform
        env:
          TF_VAR_api_service_url: ${{ steps.service-url.outputs.url }}
          TF_VAR_proto_service_url: ${{ steps.proto-service-audience.outputs.url }}
          TF_VAR_proto_image: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/proto init -input=false
          plan_path="$RUNNER_TEMP/proto.tfplan"
          plan_json="$RUNNER_TEMP/proto.tfplan.json"
          terraform -chdir=infra/proto plan \
            -input=false \
            -lock-timeout=5m \
            -out="$plan_path"
          terraform -chdir=infra/proto show -json "$plan_path" >"$plan_json"

          destructive="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$plan_json")"
          if [ "$destructive" -gt 0 ]; then
            echo "::error title=Destructive proto plan blocked::Delete or replace actions are forbidden on automatic proto deployments."
            exit 1
          fi

          terraform -chdir=infra/proto apply -input=false "$plan_path"

      - id: proto-service-url
        name: Discover Terraform-managed proto audience
        run: |
          service_url="$(gcloud run services describe "$PROTO_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$service_url"
          echo "url=$service_url" >>"$GITHUB_OUTPUT"

      - id: proto-health-auth
        name: Mint proto origin identity token through WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/animated-graph-cloud-proto
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.proto-service-url.outputs.url }}

      - name: Verify proto health and landing page
        env:
          PROTO_RUN_SERVICE_URL: ${{ steps.proto-service-url.outputs.url }}
          PROTO_RUN_ID_TOKEN: ${{ steps.proto-health-auth.outputs.id_token }}
        run: |
          proto_health="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $PROTO_RUN_ID_TOKEN" \
            "$PROTO_RUN_SERVICE_URL/health")"
          test "$proto_health" = '{"status":"ok"}'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $PROTO_RUN_ID_TOKEN" \
            "$PROTO_RUN_SERVICE_URL/" | grep -q 'Timing workspace playback prototype'

      - name: Publish pinned proto Firebase Hosting routes
        run: |
          proto_config="$RUNNER_TEMP/firebase.proto.json"
          sed "s/__PROTO_FIREBASE_SITE__/$PROTO_FIREBASE_SITE/g" \
            firebase.proto.template.json >"$proto_config"
          npx --yes firebase-tools@15.24.0 deploy \
            --only hosting \
            --config "$proto_config" \
            --project "$PROJECT_ID" \
            --non-interactive

      - name: Verify public proto release
        run: |
          test "$(curl --fail --silent --show-error --retry 5 --retry-all-errors "$PROTO_PUBLIC_BASE_URL/health")" = '{"status":"ok"}'
          curl --fail --silent --show-error "$PROTO_PUBLIC_BASE_URL/" | grep -q 'Timing workspace playback prototype'
          SHORT_RELEASE_COMMIT="${GITHUB_SHA:0:7}"
          changelog="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$PROTO_PUBLIC_BASE_URL/changelog")"
          grep -Fq "v0.8.0 · build $SHORT_RELEASE_COMMIT" <<<"$changelog"
          if grep -Fq 'Unreleased' <<<"$changelog"; then
            echo "Public proto changelog exposed repository-only Unreleased notes." >&2
            exit 1
          fi
